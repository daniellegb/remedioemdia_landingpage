<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remédio em Dia | Em construção</title>
<meta name="description" content="O Remédio em Dia está sendo preparado com cuidado. Volte em breve.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #2b5273;
    --blue: #4a8ab8;
    --mint: #a8ddcb;
    --green: #5bbfa0;
    --slate: #5d6b78;
    --bg: #f3f9f9;
    --bg-edge: #e4f2f0;
    font-family: "Quicksand", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    color: var(--navy);
    background:
      radial-gradient(60rem 40rem at 50% -10%, #fff 0%, transparent 70%),
      radial-gradient(40rem 30rem at 100% 100%, var(--bg-edge) 0%, transparent 70%),
      var(--bg);
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 5vw, 3rem) 1.25rem;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 34rem;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo {
    width: min(18rem, 70vw);
    height: auto;
    mix-blend-mode: multiply; /* funde o fundo branco do PNG com o fundo da página */
  }
  h1 {
    margin-top: clamp(1.25rem, 4vw, 2rem);
    font-size: clamp(1.5rem, 4.6vw, 2rem);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  p.lead {
    margin-top: 0.75rem;
    max-width: 28rem;
    font-size: clamp(1rem, 2.8vw, 1.125rem);
    font-weight: 500;
    line-height: 1.6;
    color: var(--slate);
    text-wrap: balance;
  }

  /* Cápsula de progresso: ecoa a cápsula do logo */
  .progress { width: 100%; max-width: 26rem; margin-top: clamp(1.75rem, 5vw, 2.5rem); }
  .capsule {
    position: relative;
    height: 2rem;
    border: 3px solid var(--blue);
    border-radius: 999px;
    background: #fff;
    padding: 3px;
  }
  .fill {
    position: relative;
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--mint) 0 50%, var(--blue) 50% 100%);
    animation: fill 2.4s cubic-bezier(.22,.8,.24,1) .3s forwards;
  }
  .check {
    position: absolute;
    right: -3px; top: 50%;
    width: 2.1rem; height: 2.1rem;
    transform: translateY(-50%);
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--bg);
    display: grid; place-items: center;
    opacity: 0;
    animation: pop .4s ease 2.5s forwards;
  }
  .check svg { width: 1.2rem; height: 1.2rem; }
  .status {
    margin-top: 0.9rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--navy);
  }
  footer {
    margin-top: clamp(2rem, 6vw, 3rem);
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--slate);
  }
  .tagline { color: var(--green); font-weight: 700; }

  @keyframes fill { to { width: 72%; } }
  @keyframes pop { from { opacity: 0; transform: translateY(-50%) scale(.6); } to { opacity: 1; transform: translateY(-50%) scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .fill { animation: none; width: 72%; }
    .check { animation: none; opacity: 1; }
  }
  @media (prefers-color-scheme: dark) {
    /* mantém a identidade clara: o logo tem fundo branco, então a página permanece clara */
    :root { color-scheme: light; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="remedio-em-dia-logo-vertical.png" alt="Remédio em Dia: organização, saúde e tranquilidade">

    <h1>Tudo está sendo preparado com cuidado</h1>
    <p class="lead">O site do Remédio em Dia ainda está em construção. Em breve, você vai encontrar aqui uma forma mais simples de manter sua saúde em dia.</p>

    <div class="progress" role="img" aria-label="Progresso da construção do site: cerca de 72%">
      <div class="capsule">
        <div class="fill">
          <span class="check" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4a8ab8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>
          </span>
        </div>
      </div>
      <p class="status">Quase pronto. Volte logo!</p>
    </div>

    <footer>© <span id="y">2026</span> Remédio em Dia</footer>
  </main>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
